databases:
  - name: mintique-db
    plan: free

services:
  - type: web
    name: mintique
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py createsuperuser --noinput || true"
    startCommand: "gunicorn mintique.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mintique-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "mintique.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: POLYGON_NETWORK
        value: "amoy"
      - key: NFT_CONTRACT_ADDRESS
        sync: false
      - key: POLYGON_AMOY_RPC_URL
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WALLETCONNECT_PROJECT_ID
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false