<form id="walletAuthForm" method="post" action="{% url 'accounts:wallet_auth' %}" style="display:none;">
  {% csrf_token %}
  <input type="hidden" name="wallet_address" id="walletAuthAddress" value="">
</form>

<div class="modal-overlay" id="authWalletModal">
  <div class="modal-box">
    <button class="modal-close" type="button" onclick="closeAuthWalletModal()">&times;</button>
    <div class="wicon">👛</div>
    <h3>Connect a wallet</h3>
    <p>First time connecting? We'll create your Mintique account automatically.</p>

    <div class="wallet-option" onclick="authConnectMetaMask()">
      <span class="wallet-option-label"><span>🦊</span> MetaMask</span>
      <svg class="ext-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </div>
    <div class="wallet-option" onclick="authConnectCoinbaseWallet()">
      <span class="wallet-option-label"><span>🔵</span> Coinbase Wallet</span>
      <svg class="ext-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </div>
    <div class="wallet-option" onclick="authConnectTrustWallet()">
      <span class="wallet-option-label"><span>🛡️</span> Trust Wallet</span>
      <svg class="ext-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </div>
    <div class="wallet-option" onclick="authConnectWalletConnect()">
      <span class="wallet-option-label"><span>🔗</span> WalletConnect</span>
      <svg class="ext-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </div>
    <div class="wallet-option" onclick="authConnectDemoWallet()">
      <span class="wallet-option-label"><span>🧪</span> Demo Wallet (no extension needed)</span>
    </div>
    <div class="wallet-option" onclick="showAuthManualWalletInput()">
      <span class="wallet-option-label"><span>✍️</span> Enter Address Manually</span>
    </div>

    <div class="manual-wallet-input" id="authManualWalletInput">
      <div class="field">
        <label>Wallet Address</label>
        <input type="text" id="authManualAddressField" placeholder="0x...">
      </div>
      <button class="btn btn-gradient btn-block" type="button" onclick="submitAuthManualWallet()">Connect</button>
    </div>
  </div>
</div>
