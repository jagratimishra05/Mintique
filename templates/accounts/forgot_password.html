{% extends "base.html" %}
{% block title %}Forgot Password — Mintique{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-box">
    <div class="auth-head">
      <h1>Forgot your password?</h1>
      <p>Enter your email and we'll send you a reset link</p>
    </div>
    <div class="auth-card">
      <form method="post" data-validate novalidate>
        {% csrf_token %}
        <div class="field">
          <label for="id_email">Email Address</label>
          <div class="input-icon-wrap">
            <span class="ico">✉</span>
            <input type="email" name="email" id="id_email" placeholder="you@example.com" required autofocus>
          </div>
        </div>
        <button type="submit" class="btn btn-gradient btn-block btn-lg">Send Reset Link</button>
      </form>
      <p class="auth-switch">Remembered it? <a href="{% url 'accounts:login' %}">Back to sign in</a></p>
    </div>
    <a href="{% url 'home' %}" class="back-link">✦ Back to Mintique</a>
  </div>
</div>
{% endblock %}
