{% extends "base.html" %}
{% block title %}Password Reset — Mintique{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-box">
    <div class="auth-card status-card">
      <div class="status-icon">✅</div>
      <h1>Password updated</h1>
      <p class="muted" style="margin-top:12px;">Your password has been changed successfully. You can sign in now.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-gradient btn-block" style="margin-top:26px;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
