{% extends "base.html" %}
{% block title %}Check Your Email — Mintique{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-box">
    <div class="auth-card status-card">
      <div class="status-icon">📬</div>
      <h1>Check your inbox</h1>
      <p class="muted" style="margin-top:12px;">
        If an account exists for that email, we've sent a link to reset your password.
        The link expires in a few days for security.
      </p>
      <a href="{% url 'accounts:login' %}" class="btn btn-outline btn-block" style="margin-top:26px;">Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
